<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Developer Dashboard</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 40px 0; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card-header { font-weight: bold; text-transform: uppercase; letter-spacing: 1px; border-radius: 15px 15px 0 0 !important; }
        .api-response { background: #2c3e50; color: #2ecc71; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.85rem; max-height: 300px; overflow-y: auto; white-space: pre-wrap; margin-top: 15px; }
        .form-label { font-size: 0.8rem; font-weight: 700; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <h2 class="text-center mb-5 text-dark">BSC Testnet Wallet Manager</h2>

            <div class="card">
                <div class="card-header bg-primary text-white">1. Create New Wallet</div>
                <div class="card-body">
                    <p class="text-muted small">Endpoint: <code>/api/wallet/generate/</code></p>
                    <button id="genBtn" class="btn btn-primary px-4">Generate Wallet</button>
                    <div id="genResult" class="api-response d-none"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-warning text-dark">2. Transfer Native tBNB</div>
                <div class="card-body">
                    <p class="text-muted small">Endpoint: <code>/api/bnb/transfer/</code></p>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">SENDER PRIVATE KEY</label>
                            <input type="password" id="bnbPrivKey" class="form-control" placeholder="0x...">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">RECIPIENT ADDRESS</label>
                            <input type="text" id="bnbDestAddr" class="form-control" placeholder="0x...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">AMOUNT (tBNB)</label>
                            <input type="number" id="bnbAmount" class="form-control" placeholder="0.1" step="0.001">
                        </div>
                    </div>
                    <button id="bnbSendBtn" class="btn btn-dark w-100 mt-4">Broadcast BNB Transaction</button>
                    <div id="bnbResult" class="api-response d-none"></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-info text-white">3. Transfer BEP-20 Tokens</div>
                <div class="card-body">
                    <p class="text-muted small">Endpoint: <code>/api/token/transfer/</code></p>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">SENDER PRIVATE KEY</label>
                            <input type="password" id="tokenPrivKey" class="form-control" placeholder="0x...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">TOKEN CONTRACT ADDRESS</label>
                            <input type="text" id="tokenContract" class="form-control" value="{{ example_token_address }}">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">RECEIVER ADDRESS</label>
                            <input type="text" id="tokenDestAddr" class="form-control" placeholder="0x...">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">TOKEN AMOUNT</label>
                            <input type="number" id="tokenAmount" class="form-control" placeholder="10">
                        </div>
                    </div>
                    <button id="tokenSendBtn" class="btn btn-info w-100 mt-4 text-white">Broadcast Token Transaction</button>
                    <div id="tokenResult" class="api-response d-none"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // Universal helper for API POST requests
    async function apiRequest(url, payload) {
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch (err) {
            return { status: "error", message: "Failed to connect to server." };
        }
    }

    // --- 1. Generate Wallet Logic ---
    document.getElementById('genBtn').onclick = async () => {
        const box = document.getElementById('genResult');
        box.classList.remove('d-none');
        box.innerText = "Generating Wallet...";
        const data = await apiRequest('/api/wallet/generate/', {});
        box.innerText = JSON.stringify(data, null, 2);
    };

    // --- 2. Send BNB Logic ---
    document.getElementById('bnbSendBtn').onclick = async () => {
        const box = document.getElementById('bnbResult');
        box.classList.remove('d-none');
        box.innerText = "Broadcasting BNB Transaction...";

        const payload = {
            private_key: document.getElementById('bnbPrivKey').value,
            recipient_address: document.getElementById('bnbDestAddr').value, // Matches views.py
            amount: document.getElementById('bnbAmount').value
        };

        const data = await apiRequest('/api/bnb/transfer/', payload);
        box.innerText = JSON.stringify(data, null, 2);
    };

    // --- 3. Send Token Logic ---
    document.getElementById('tokenSendBtn').onclick = async () => {
        const box = document.getElementById('tokenResult');
        box.classList.remove('d-none');
        box.innerText = "Broadcasting Token Transaction...";

        const payload = {
            private_key: document.getElementById('tokenPrivKey').value,
            token_address: document.getElementById('tokenContract').value,
            receiver_address: document.getElementById('tokenDestAddr').value, // Matches views.py
            amount: document.getElementById('tokenAmount').value
        };

        const data = await apiRequest('/api/token/transfer/', payload);
        box.innerText = JSON.stringify(data, null, 2);
    };
</script>
</body>
</html>
